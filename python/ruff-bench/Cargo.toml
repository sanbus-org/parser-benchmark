[package]
name = "ruff_bench"
version = "0.0.0"
edition = "2021"

[lib]
name = "ruff_bench"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.0" }

# Ruff ships with jemalloc as its allocator on these targets; use it here so
# the benchmark allocates the way Ruff does.
[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator = { version = "0.6.0", default-features = false, features = ["background_threads_runtime_support"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
