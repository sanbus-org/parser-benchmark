[package]
name = "lalrpop_python_bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "lalrpop_python_bench"
path = "src/lib.rs"
# A shared library avoids linking a second Rust static runtime alongside
# Ruff's staticlib, which would duplicate `_rust_eh_personality`.
crate-type = ["cdylib"]

[dependencies]
# RustPython's Python parser is generated by LALRPOP from
# parser/src/python.lalrpop. Enable the lalrpop feature so the grammar is
# regenerated at build time instead of using the crate's checked-in output.
rustpython-parser = { version = "=0.4.0", features = ["lalrpop"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# The C ABI never unwinds across the shared-library boundary.
panic = "abort"
